<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosquet Lent - Jeu contemplatif</title>
  <meta name="theme-color" content="#142221">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bosquet Lent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="Jeu de marche contemplative dans une foret en 2D"></canvas>

    <section id="startScreen" class="start-screen">
      <div class="title-block">
        <p class="eyebrow">Marche contemplative en 2D</p>
        <h1>Bosquet Lent</h1>
        <p class="intro">Explore une foret douce, allume les lanternes, collectionne de petites trouvailles et repose-toi pres de la riviere.</p>
        <div class="start-actions">
          <button id="startButton" class="primary-button" type="button">Commencer</button>
          <button id="continueButton" class="secondary-button" type="button">Continuer</button>
        </div>
      </div>
    </section>

    <section class="hud" aria-live="polite">
      <div class="hud-group">
        <span id="partyLabel" class="hud-pill">Solo</span>
        <button id="leavePartyButton" class="party-exit" type="button" title="Quitter la partie" aria-label="Quitter la partie">x</button>
        <button id="reactionButton" class="reaction-button" type="button" title="Reactions" aria-label="Reactions">:)</button>
        <button id="muteButton" class="sound-button" type="button" title="Couper le son" aria-label="Couper le son">Son</button>
        <button id="journalButton" class="icon-button" type="button" title="Carnet">Carnet</button>
        <button id="optionsButton" class="icon-button" type="button" title="Options">Options</button>
      </div>
    </section>
    <div id="reactionMenu" class="reaction-menu" aria-label="Choisir une reaction">
      <button type="button" data-reaction=":)">:)</button>
      <button type="button" data-reaction="!">!</button>
      <button type="button" data-reaction="?">?</button>
      <button type="button" data-reaction="<3">&lt;3</button>
      <button type="button" data-reaction="*">*</button>
    </div>

    <aside id="message" class="message" aria-live="polite"></aside>
    <section id="cinematic" class="cinematic" aria-live="polite">
      <div class="cinematic-frame">
        <p id="cinematicText"></p>
      </div>
    </section>

    <div id="mobilePad" class="mobile-pad" aria-hidden="true">
      <div id="padKnob" class="pad-knob"></div>
    </div>

    <dialog id="journalDialog" class="panel-dialog">
      <form method="dialog">
        <header class="panel-header">
          <h2>Carnet de voyage</h2>
          <button class="close-button" value="close" type="submit">Fermer</button>
        </header>
        <div id="journalList" class="journal-list"></div>
      </form>
    </dialog>

    <dialog id="villagerDialog" class="panel-dialog compact-dialog">
      <form method="dialog">
        <header class="panel-header">
          <h2 id="villagerTitle">Habitant</h2>
          <button class="close-button" value="close" type="submit">Fermer</button>
        </header>
        <p id="villagerText" class="dialog-copy"></p>
        <div class="choice-actions">
          <button id="giveItemButton" class="primary-button" type="button">Donner l'objet</button>
          <button id="refuseHelpButton" class="secondary-button" type="button">Ne pas donner</button>
        </div>
      </form>
    </dialog>

    <dialog id="optionsDialog" class="panel-dialog">
      <form method="dialog">
        <header class="panel-header">
          <h2>Options</h2>
          <button class="close-button" value="close" type="submit">Fermer</button>
        </header>
        <label class="slider-row">
          <span>Musique</span>
          <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.22">
        </label>
        <label class="slider-row">
          <span>Nature</span>
          <input id="natureVolume" type="range" min="0" max="1" step="0.01" value="0.32">
        </label>
        <section class="options-section" aria-label="Joueur">
          <h3>Joueur</h3>
          <label class="field-row">
            <span>Pseudo</span>
            <input id="nicknameInput" type="text" maxlength="18" autocomplete="nickname" placeholder="Voyageur">
          </label>
          <p id="anonymousId" class="identity-note"></p>
        </section>
        <section class="options-section" aria-label="Partie ami">
          <div class="party-heading">
            <h3>Partie ami</h3>
            <button id="leavePartyOptionsButton" class="mini-close-button" type="button" title="Quitter la partie" aria-label="Quitter la partie">x</button>
          </div>
          <p id="partyStatus" class="identity-note">Solo</p>
          <div class="party-card">
            <button id="createPartyButton" class="secondary-button" type="button">Creer une partie</button>
            <label class="field-row">
              <span>Code ami</span>
              <input id="partyCodeInput" type="text" maxlength="6" inputmode="text" placeholder="X8P4K2">
            </label>
            <button id="joinPartyButton" class="secondary-button" type="button">Rejoindre</button>
          </div>
        </section>
        <button id="resetButton" class="danger-button" type="button">Recommencer la promenade</button>
      </form>
    </dialog>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
